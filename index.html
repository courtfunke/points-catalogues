<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Order Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      margin-bottom: 15px;
      text-align: center;
    }
    .timer {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
      background: #e2e8f0;
      padding: 8px 16px;
      border-radius: 20px;
    }
    .list-container {
      width: 100%;
      max-width: 380px;
      list-style-type: none;
      padding: 0;
      margin: 0 0 20px 0;
    }
    .draggable-item {
      background-color: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 20px;
      margin-bottom: 10px;
      cursor: grab;
      font-size: 18px;
      font-weight: 600;
      color: #334155;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .draggable-item.dragging {
      opacity: 0.4;
      border: 2px dashed #64748b;
    }
    .draggable-item.correct {
      border: 3px solid #2ecc71 !important;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
    }
    .hint-img {
      max-height: 38px;
      width: auto;
      display: block;
      margin: 0 auto;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    #check-btn {
      background-color: #3498db;
    }
    #check-btn:hover {
      background-color: #2980b9;
    }
    #hint-btn {
      background-color: #e67e22;
    }
    #hint-btn:hover {
      background-color: #d35400;
    }
    #hint-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    #win-message {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #27ae60;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Word Order Puzzle</h1>
  <p>Drag and drop the items into the correct order!</p>

  <div class="timer">Time: <span id="timer-display">0</span>s</div>

  <ul class="list-container" id="word-list"></ul>

  <div class="controls">
    <button id="check-btn">CHECK</button>
    <button id="hint-btn">HINT</button>
  </div>

  <div id="win-message"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Inline SVG definitions for standalone image support
      const itemData = {
        "Strawberry": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20 C20 20 10 50 25 80 C35 100 65 100 75 80 C90 50 80 20 50 20 Z' fill='%23e74c3c'/><path d='M50 20 Q40 5 30 15 Q50 25 50 20 Q50 25 70 15 Q60 5 50 20' fill='%2327ae60'/><circle cx='40' cy='40' r='2' fill='%23f1c40f'/><circle cx='60' cy='40' r='2' fill='%23f1c40f'/><circle cx='50' cy='60' r='2' fill='%23f1c40f'/><circle cx='35' cy='70' r='2' fill='%23f1c40f'/><circle cx='65' cy='70' r='2' fill='%23f1c40f'/></svg>",
        "Pumpkin": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='45' y='10' width='10' height='20' rx='3' fill='%2327ae60'/><ellipse cx='50' cy='60' rx='40' ry='30' fill='%23e67e22'/><ellipse cx='50' cy='60' rx='25' ry='30' fill='%23d35400'/><ellipse cx='50' cy='60' rx='10' ry='30' fill='%23e67e22'/></svg>",
        "Lemon": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='50' rx='40' ry='28' fill='%23f1c40f' transform='rotate(-15 50 50)'/><path d='M12 58 Q8 50 15 42 Z M85 58 Q92 50 85 42 Z' fill='%23f1c40f'/></svg>",
        "Broccoli": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M40 50 L40 85 Q50 90 60 85 L60 50 Z' fill='%2327ae60'/><circle cx='35' cy='40' r='20' fill='%232ecc71'/><circle cx='65' cy='40' r='20' fill='%232ecc71'/><circle cx='50' cy='25' r='22' fill='%2327ae60'/></svg>",
        "Blueberry": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='32' fill='%232980b9'/><polygon points='50,23 43,30 46,38 54,38 57,30' fill='%231f618d'/></svg>",
        "Concord Grape": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 15 Q55 5 65 10' stroke='%2327ae60' stroke-width='4' fill='none'/><circle cx='35' cy='35' r='14' fill='%238e44ad'/><circle cx='65' cy='35' r='14' fill='%238e44ad'/><circle cx='50' cy='45' r='14' fill='%236c3483'/><circle cx='38' cy='60' r='14' fill='%238e44ad'/><circle cx='62' cy='60' r='14' fill='%238e44ad'/><circle cx='50' cy='75' r='14' fill='%236c3483'/></svg>",
        "Violet": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 50 Q30 20 50 10 Q70 20 50 50 Z' fill='%239b59b6'/><path d='M50 50 Q20 30 10 50 Q20 70 50 50 Z' fill='%238e44ad'/><path d='M50 50 Q80 30 90 50 Q80 70 50 50 Z' fill='%238e44ad'/><path d='M50 50 Q30 80 40 90 Q60 90 50 50 Z' fill='%239b59b6'/><circle cx='50' cy='50' r='6' fill='%23f1c40f'/></svg>"
      };

      const correctOrder = [
        "Strawberry",
        "Pumpkin",
        "Lemon",
        "Broccoli",
        "Blueberry",
        "Concord Grape",
        "Violet"
      ];

      const listContainer = document.getElementById("word-list");
      const checkBtn = document.getElementById("check-btn");
      const hintBtn = document.getElementById("hint-btn");
      const winMessage = document.getElementById("win-message");
      const timerDisplay = document.getElementById("timer-display");

      let draggedItem = null;
      let secondsElapsed = 0;
      let timerInterval = null;
      let hintsActive = false;

      // Derangement algorithm guarantees no item starts in its correct slot
      function getDerangedOrder(array) {
        let shuffled = [...array];
        let isDeranged = false;

        while (!isDeranged) {
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          isDeranged = shuffled.every((val, index) => val !== array[index]);
        }
        return shuffled;
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          secondsElapsed++;
          timerDisplay.textContent = Math.round(secondsElapsed);
        }, 1000);
      }

      function initGame() {
        listContainer.innerHTML = "";
        winMessage.style.display = "none";

        const shuffledWords = getDerangedOrder(correctOrder);

        shuffledWords.forEach((word) => {
          const li = document.createElement("li");
          li.className = "draggable-item";
          li.draggable = true;
          li.dataset.word = word;
          li.textContent = word;

          // Drag events
          li.addEventListener("dragstart", function() {
            draggedItem = this;
            setTimeout(() => this.classList.add("dragging"), 0);
          });

          li.addEventListener("dragend", function() {
            this.classList.remove("dragging");
            draggedItem = null;
          });

          // Touch support for mobile devices
          li.addEventListener("touchstart", function(e) {
            draggedItem = this;
            this.classList.add("dragging");
          }, { passive: true });

          li.addEventListener("touchmove", function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains("draggable-item") && target !== draggedItem) {
              const rect = target.getBoundingClientRect();
              const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
              listContainer.insertBefore(draggedItem, next ? target.nextSibling : target);
            }
          }, { passive: false });

          li.addEventListener("touchend", function() {
            if (draggedItem) {
              draggedItem.classList.remove("dragging");
              draggedItem = null;
            }
          });

          listContainer.appendChild(li);
        });

        startTimer();
      }

      listContainer.addEventListener("dragover", function(e) {
        e.preventDefault();
        const afterElement = [...listContainer.querySelectorAll(".draggable-item:not(.dragging)")].reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = e.clientY - box.top - box.height / 2;
          return (offset < 0 && offset > closest.offset) ? { offset: offset, element: child } : closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;

        if (draggedItem) {
          if (afterElement == null) {
            listContainer.appendChild(draggedItem);
          } else {
            listContainer.insertBefore(draggedItem, afterElement);
          }
        }
      });

      checkBtn.addEventListener("click", function() {
        const currentItems = document.querySelectorAll(".draggable-item");
        let correctCount = 0;

        currentItems.forEach((item, index) => {
          if (item.dataset.word === correctOrder[index]) {
            item.classList.add("correct");
            correctCount++;
          } else {
            item.classList.remove("correct");
          }
        });

        if (correctCount === correctOrder.length) {
          clearInterval(timerInterval);
          const finalScore = Math.round(secondsElapsed);
          winMessage.innerHTML = `🎉 Perfect! You solved the puzzle!<br>Final Score: <strong>${finalScore}</strong> seconds.`;
          winMessage.style.display = "block";
          checkBtn.disabled = true;
          hintBtn.disabled = true;
          currentItems.forEach(item => item.draggable = false);
        }
      });

      hintBtn.addEventListener("click", function() {
        const confirmHint = confirm("Are you sure you want a hint? This will add 30 seconds to your total score.");
        if (confirmHint) {
          secondsElapsed += 30;
          timerDisplay.textContent = Math.round(secondsElapsed);
          hintsActive = true;
          hintBtn.disabled = true;

          const currentItems = document.querySelectorAll(".draggable-item");
          currentItems.forEach((item) => {
            const word = item.dataset.word;
            item.innerHTML = `<img src="${itemData[word]}" alt="${word}" class="hint-img" />`;
          });
        }
      });

      initGame();
    });
  </script>
</body>
</html>
