<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow Word Order Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 20px;
      text-align: center;
    }
    .list-container {
      width: 100%;
      max-width: 400px;
      list-style-type: none;
      padding: 0;
      margin: 0 0 20px 0;
    }
    .draggable-item {
      background-color: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 10px;
      cursor: grab;
      font-size: 18px;
      font-weight: 600;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
    }
    .draggable-item:active {
      cursor: grabbing;
    }
    .draggable-item.dragging {
      opacity: 0.4;
      border-dash: dashed;
    }
    /* Correct position outline requirement */
    .draggable-item.correct {
      border: 3px solid #2ecc71;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    #win-message {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #2ecc71;
      display: none;
    }
  </style>
</head>
<body>

  <p>Drag and drop the words into the correct order!</p>
